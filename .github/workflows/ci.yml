name: CI

# Pull requests are tested through pull_request; push only covers master, so
# a PR from a branch in this repo does not run the matrix twice.
on:
  push:
    branches: [master]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read # check out the repository

# One run per branch/PR: a newer push to a pull request cancels the older run;
# runs on master are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Supported, non-EOL lines plus the current release (Node 20 went EOL 2026-04-30).
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install
      run: npm ci

    - name: Type-check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Test
      run: npm test
