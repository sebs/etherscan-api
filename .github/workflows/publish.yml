name: Publish

# Manually publish a previously released version to the npm registry.
# Authentication uses npm Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this run and npm verifies it against the trusted publisher
# configured for the package — no long-lived NPM_TOKEN is stored.
#
# One-time setup on npmjs.com: package `etherscan-api` -> Settings -> Trusted
# Publisher -> GitHub Actions, repo `sebs/etherscan-api`, workflow `publish.yml`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish to npm, e.g. 11.0.0'
        required: true
        type: string

# No workflow-wide token; the publish job asks for exactly what it needs.
permissions: {}

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # OIDC trusted publishing needs an id-token; provenance is attached automatically.
    permissions:
      contents: read # check out the tagged source
      id-token: write # OIDC token for npm trusted publishing and provenance

    steps:
      # Publish exactly the tagged source for the requested version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires npm >= 11.5.1. Node 24 bundles it
          # (since 24.5.0), so no npm is installed outside the lockfile.
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a workflow that publishes something: a
          # poisoned cache would flow into the published output.
          package-manager-cache: false

      # The input reaches the shell as an environment variable, never spliced
      # into the script text, so a crafted value cannot inject commands.
      - name: Verify package.json matches the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$REQUESTED_VERSION" ]; then
            echo "::error::package.json version ('$pkg') does not match requested version ('$REQUESTED_VERSION')."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # No NPM_TOKEN: OIDC provides the short-lived credential, and provenance
      # is generated from this workflow run.
      #
      # The dist-tag is always explicit because an anomalous `100.0.0` (published
      # 2019, under the `next` tag) is the highest version on the registry. npm
      # refuses to move `latest` implicitly when a higher version exists.
      # A stable release is the intended `latest`; a prerelease (13.0.0-beta.1)
      # goes to `next`, so a plain `npm install etherscan-api` never gets it.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"
