name: Docs

# Builds the TypeDoc API docs and deploys them to GitHub Pages — replacing the
# old `gh-pages` npm dependency with first-party GitHub Actions.
#
# Publishes on every new stable version tag (e.g. created by `npm version`), so
# the docs site always reflects the latest release. Prerelease tags
# (v13.0.0-beta.1) are skipped. Also runnable manually.
#
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions".
on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
  workflow_dispatch:

# Least-privilege token; only the deploy job gets the Pages/OIDC scopes.
permissions:
  contents: read

# Allow one in-flight Pages deployment at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          # No dependency cache in a workflow that publishes something: a
          # poisoned cache would flow into the published output.
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build docs
        run: npm run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5