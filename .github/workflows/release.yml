name: Release

# Fires when a version tag is pushed, e.g. created by `npm version <patch|minor|major>`
# (which bumps package.json and creates the matching tag).
on:
  push:
    tags:
      - 'v*'

# Needed for softprops/action-gh-release to create the GitHub release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so the release notes can find the previous tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.ver.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$pkg'."
            exit 1
          fi

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      # `npm pack` produces the npm-native package tarball (.tgz), ready to upload.
      - name: Pack npm tarball
        run: |
          mkdir -p dist-artifacts
          npm pack --pack-destination dist-artifacts
          ls -la dist-artifacts

      # The release notes are the changelog: one line per commit since the
      # previous v* tag. GitHub's generated notes are built from merged pull
      # requests, which this repo does not use, so they would come out empty.
      # Version-bump commits (subject "12.2.0" or "13.0.0-beta.1") are left out. A stable release
      # is compared with the previous stable tag, skipping prereleases
      # (v13.0.0-beta.1), so it lists everything since the last stable release.
      - name: Write release notes
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) skip=() ;;
            *) skip=(--exclude 'v*-*') ;;
          esac
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${skip[@]}" "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='%h %s' "$range" |
              awk '$2 !~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/ { h = $1; sub(/^[^ ]+ /, ""); print "- " $0 " (" h ")" }'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist-artifacts/*.tgz
          body_path: RELEASE_NOTES.md
          # A prerelease tag (v13.0.0-beta.1) must not become the "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
