name: Release

# Fires when a version tag is pushed, e.g. created by `npm version <patch|minor|major>`
# (which bumps package.json and creates the matching tag).
on:
  push:
    tags:
      - 'v*'

# No workflow-wide token; the release job asks for exactly what it needs.
permissions: {}

# One release run per tag; a second push of the same tag waits, never cancels.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create: create the release and upload the tarball

    steps:
      # Full history and tags, so the release notes can find the previous tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          # No dependency cache in a workflow that publishes something: a
          # poisoned cache would flow into the published output.
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$pkg'."
            exit 1
          fi

      # npm ci installs exactly the lockfile, so the attached tarball is built
      # from the dependency tree CI tested.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # `npm pack` produces the npm-native package tarball (.tgz), ready to upload.
      - name: Pack npm tarball
        run: |
          mkdir -p dist-artifacts
          npm pack --pack-destination dist-artifacts
          ls -la dist-artifacts

      # The release notes are the changelog: one line per commit since the
      # previous v* tag. GitHub's generated notes are built from merged pull
      # requests, which this repo does not use, so they would come out empty.
      # Version-bump commits (subject "12.2.0" or "13.0.0-beta.1") are left out. A stable release
      # is compared with the previous stable tag, skipping prereleases
      # (v13.0.0-beta.1), so it lists everything since the last stable release.
      - name: Write release notes
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) skip=() ;;
            *) skip=(--exclude 'v*-*') ;;
          esac
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${skip[@]}" "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='%h %s' "$range" |
              awk '$2 !~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/ { h = $1; sub(/^[^ ]+ /, ""); print "- " $0 " (" h ")" }'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # A prerelease tag (v13.0.0-beta.1) is marked as one, so it never becomes
      # the "Latest" release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist-artifacts/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${prerelease[@]}"
